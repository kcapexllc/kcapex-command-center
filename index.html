<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KCAPEX Command Center</title>
  <meta name="description" content="KCAPEX internal GovCon command center: bids, leads, jobs, contracts, messages and the Pipeline." />
  <meta name="theme-color" content="#f7f5fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#140a24" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KCAPEX" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="claude-shim.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="36" height="36" />
        <div>
          <div class="brand-name">KCAPEX</div>
          <div class="brand-sub">Command Center</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <img class="topbar-logo" src="icons/icon-192.png" alt="" width="28" height="28" />
          <h1 id="view-title">Command Center</h1>
        </div>
        <div class="topbar-actions">
          <span class="today" id="today"></span>
          <span class="sync" id="sync">Connecting</span>
          <button class="icon-btn" id="more-btn" aria-label="More" title="More: New, Quick-turn, People, Subs, Library, Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
          </button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
  <button class="fab" id="fab" aria-label="Add new" hidden>
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>

  <dialog id="modal" class="modal">
    <form id="modal-form" method="dialog" class="modal-inner"></form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
