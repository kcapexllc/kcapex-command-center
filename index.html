<style>
:root{
  --paper:#f7f5fb; --card:#ffffff; --ink:#1a0b2e; --ink2:#4b4560; --mute:#8a84a0; --line:#e6e0f3;
  --brand:#4c1d95; --brand2:#7c3aed; --lav:#ede4ff; --lav2:#c4b5fd; --red:#b42318; --redbg:#fde8e6; --green:#1f7a4d; --greenbg:#e3f5ea; --amber:#9a5b00; --amberbg:#fff1d6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#140a24; --card:#1f1233; --ink:#f3eefc; --ink2:#cfc6e4; --mute:#8f86a8; --line:#332351;
  --brand:#c4b5fd; --brand2:#a78bfa; --lav:#2b1a4a; --lav2:#4c2d86; --red:#ff8a80; --redbg:#4a1a17; --green:#7ee2a8; --greenbg:#153d2a; --amber:#ffcf7a; --amberbg:#3d2b0a; }}
:root[data-theme="dark"]{
  --paper:#140a24; --card:#1f1233; --ink:#f3eefc; --ink2:#cfc6e4; --mute:#8f86a8; --line:#332351;
  --brand:#c4b5fd; --brand2:#a78bfa; --lav:#2b1a4a; --lav2:#4c2d86; --red:#ff8a80; --redbg:#4a1a17; --green:#7ee2a8; --greenbg:#153d2a; --amber:#ffcf7a; --amberbg:#3d2b0a; }
html{scroll-padding-top:env(safe-area-inset-top,0px)} html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Poppins,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px 18px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wordmark{font-weight:700;font-size:20px;letter-spacing:.5px;color:var(--brand)}
.wordmark small{font-weight:500;color:var(--mute);letter-spacing:0;font-size:13px;margin-left:8px}
.sync{font-size:12px;color:var(--mute)}
main{flex:1;padding:4px 18px 96px}
h1{font-size:26px;line-height:1.15;margin:12px 0 4px;font-weight:600}
h2{font-size:16px;margin:22px 0 8px;font-weight:600;color:var(--ink2)}
p{margin:0 0 10px}
.sub{color:var(--mute);font-size:13px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--lav);color:var(--brand)} .btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink2)}
.btn.danger{background:var(--redbg);color:var(--red)} .btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;border-radius:999px;padding:6px 12px;border:1.5px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card.static{cursor:default}
.opp{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.days{font-size:30px;font-weight:700;line-height:1;color:var(--brand)}
.days small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:3px}
.days.hot{color:var(--red)} .days.done{color:var(--mute)}
.ttl{font-weight:600;line-height:1.3} .meta{color:var(--mute);font-size:13px;margin-top:2px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--lav);color:var(--brand);margin-top:6px;margin-right:4px}
.tag.red{background:var(--redbg);color:var(--red)} .tag.green{background:var(--greenbg);color:var(--green)} .tag.amber{background:var(--amberbg);color:var(--amber)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 18px;color:var(--mute);text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav.tabs button{background:none;border:0;flex:1;min-width:0;padding:6px 1px;font-size:11px;color:var(--mute);border-radius:10px}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs button span{display:block;font-size:20px;line-height:1;margin-bottom:3px}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto;padding:0 18px calc(40px + env(safe-area-inset-bottom,0px));display:none}
.sheet.open{display:block}
.sheet .bar{position:sticky;top:0;background:var(--paper);padding:calc(12px + env(safe-area-inset-top,0px)) 0 8px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.back{background:none;border:0;color:var(--brand2);font-weight:600;padding:6px 0;cursor:pointer}
label.f{display:block;margin:12px 0 0;font-size:13px;color:var(--ink2);font-weight:500}
input.t,select.t,textarea.t{width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--brand2)}
textarea.t{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px;margin:8px 0}
.kv b{color:var(--mute);font-weight:500}
.ai{background:var(--card);border:1.5px solid var(--lav2);border-radius:14px;padding:14px 16px;margin:14px 0}
.ai h3{margin:0 0 4px;font-size:15px;color:var(--brand)}
.out{white-space:pre-wrap;background:var(--paper);border-radius:10px;padding:12px;font-size:14px;margin-top:10px;max-height:50vh;overflow:auto}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

.check.done{color:var(--mute);text-decoration:line-through}
.note{border-left:3px solid var(--lav2);padding:6px 10px;margin:8px 0;font-size:14px}

.score{display:flex;gap:14px;align-items:center;margin-top:10px}

.toast.show{opacity:1}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(76,29,149,.35);z-index:7;cursor:pointer}
.srch{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0 2px;outline:none}
.srch:focus{border-color:var(--brand2)}
.lnk{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--lav);color:var(--brand);padding:4px 6px 4px 12px;font-size:13px;margin:4px 6px 0 0;cursor:pointer}
.lnk button{border:0;background:transparent;color:var(--brand);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.pl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.pl .g3{display:grid;grid-template-columns:70px 1fr 70px;gap:8px}
.pl input{margin-top:0}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin-top:10px}
.tot b{text-align:right} .tot .big{font-size:18px;font-weight:700;color:var(--brand)}
table.sc{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px} table.sc td,table.sc th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right} table.sc td:first-child,table.sc th:first-child{text-align:left}
.notice{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
/* board */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 2px}
.seg button{border:0;background:var(--card);color:var(--ink2);padding:7px 14px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.board{display:flex;gap:10px;overflow-x:auto;padding:8px 0 16px;margin:0 -18px;padding-left:18px;padding-right:18px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;align-items:flex-start}
.kcol{flex:0 0 250px;background:var(--lav);border-radius:14px;padding:10px;min-height:120px;scroll-snap-align:start;transition:box-shadow .15s}
.kcol.over{box-shadow:0 0 0 2px var(--brand2) inset}
.kcol h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--brand);text-transform:capitalize;display:flex;justify-content:space-between}
.kcol h3 span{color:var(--mute);font-weight:500}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 8px;margin-bottom:8px;display:grid;grid-template-columns:22px 1fr;gap:6px;cursor:pointer;position:relative}
.kcard.lift{opacity:.35}
.kcard .grip{color:var(--mute);font-size:18px;line-height:1;touch-action:none;cursor:grab;user-select:none;padding-top:2px}
.kcard .kt{font-weight:600;font-size:13.5px;line-height:1.3}
.kcard .km{color:var(--mute);font-size:12px;margin-top:3px}
.kcard .kd{font-size:12px;font-weight:600;color:var(--brand);margin-top:4px}
.btn.nbtn{padding:4px 9px;font-size:12px;border-radius:7px;text-decoration:none}a.btn{text-decoration:none}
.kcard .kd.hot{color:var(--red)}
/* delete X, top right of each bid card */
.card.opp{position:relative;padding-right:44px}
.kcard{padding-right:34px}
.card.hx{position:relative;padding-right:44px}
.xdel{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--mute);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.xdel:hover,.xdel:focus-visible{background:var(--redbg);color:var(--red)}
.kcard .xdel{top:6px;right:6px;width:24px;height:24px;font-size:17px}
/* in-page confirm box: browser pop-ups are blocked inside Claude */
.modal{position:fixed;inset:0;background:rgba(10,4,20,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.modal .box p{margin:0;font-weight:500;line-height:1.4}
.modal .box .row{justify-content:flex-end;margin-top:16px}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:12px;align-items:center;font-size:13px;z-index:31;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.undo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:6px 10px;cursor:pointer;opacity:.85}
.kghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:rotate(2deg);opacity:.95}
.kcol .kmore{width:100%;border:1.5px dashed var(--lav2);background:transparent;border-radius:10px;padding:8px;color:var(--brand);font-size:13px;cursor:pointer}
/* relationships and quotes */
.rel{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin-top:6px;margin-right:4px}
.rel.cold{background:var(--redbg);color:var(--red)} .rel.due{background:var(--amberbg);color:var(--amber)} .rel.warm{background:var(--greenbg);color:var(--green)} .rel.none{background:var(--lav);color:var(--mute)}
.qrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.qrow .qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qrow .qh b{font-size:14px}
.steps{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.step{font-size:11.5px;border-radius:999px;padding:3px 9px;background:var(--lav);color:var(--brand)}
.step.done{background:var(--greenbg);color:var(--green)} .step.late{background:var(--redbg);color:var(--red)}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.season{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 6px}
.season>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.season .lv{font-size:12px;color:var(--mute);font-weight:500}
.season .md{font-weight:700;font-size:15px;color:var(--brand2)}
.season .bid .md{color:var(--green)}
.season .sb{font-size:12px;color:var(--mute);overflow-wrap:anywhere;line-height:1.3}
details.yr summary{cursor:pointer;color:var(--brand2);font-size:13px;font-weight:600;margin:4px 0 6px}
table.yr{width:100%;border-collapse:collapse;font-size:13px}
table.yr td,table.yr th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
table.yr th{color:var(--mute);font-weight:500}
table.yr .b{color:var(--green);font-weight:600}
table.yr tr.now td{background:var(--lav)}
.lvlpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.lvlcard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;cursor:pointer}
.lvlcard .lv{font-size:13px;color:var(--mute);font-weight:500}
.lvlcard .md{font-size:20px;font-weight:700;color:var(--brand2);line-height:1.25}
.lvlcard.bid .md{color:var(--green)}
.lvlcard .sb{font-size:12px;color:var(--mute);line-height:1.3;overflow-wrap:anywhere}
.lvlcard .sb b{color:var(--ink2);font-weight:600}
.lvlcard.on{border-color:var(--brand2);background:var(--lav);box-shadow:0 0 0 1px var(--brand2) inset}
.portals{margin:12px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.portals summary{cursor:pointer;font-weight:600;color:var(--brand);padding:10px 0;list-style-position:inside}
.portals summary .sub{font-weight:500;margin-left:6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.prow .ttl{font-size:14px}
.prow .pa{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.prow .pa .btn{justify-content:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="app">
<header class="top"><div class="wordmark">KCAPEX<small>Pipeline</small></div><div class="sync" id="sync">Connecting</div></header>
<main id="main"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<button class="fab" id="fab" aria-label="Add" title="Add">+</button>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- constants ---------- */
const STATUSES=["found","reviewing","bid","no-bid","submitted","awarded","lost","cancelled"];
const ACTIVE=["found","reviewing","bid","submitted"];
const KCAPEX=`KCAPEX LLC, small business federal prime contractor, Merrillville IN. UEI PCATNSPCZFE9, CAGE 190W7. Self-certified small business only; no 8(a), SDVOSB, VOSB, WOSB, or HUBZone. Strategy: price-based, single-trade, easily subcontracted work (janitorial, facility services, building component replacement, HVAC, flooring, painting, mold remediation, moving, equipment maintenance). Prefers quick-turnaround postings and requirements contracting officers want off their plate. Performs through local teaming subcontractors; KCAPEX is prime and single point of accountability. Past performance: Air Force Beale AFB carpet and floor tile; USDA Forest Service janitorial; BLM rooftop HVAC replacement; USFWS water filtration; USFWS door replacement. House style for emails: short, factual, solicitation number in subject, ask for confirmation of receipt, signed Kobe Williams, CEO and Co-Owner, 219-333-6902, kcapexllc@gmail.com.`;

const COLL={opportunities:"Opportunities",contacts:"Contacts",subs:"Subcontractors",pastperf:"Past performance",tasks:"Tasks"};
const FIELDS={
 opportunities:[
  ["title","Title","text"],["sol","Solicitation number","text"],["agency","Agency","text"],["office","Contracting office","text"],
  ["noticeType","Notice type","select",["RFQ","RFP","Sources sought","Presolicitation","Combined synopsis","Solicitation","IFB","State or local","Other"]],["setAside","Set-aside","text"],
  ["naics","NAICS","text"],["place","Place of performance","text"],["posted","Posted","date"],["due","Due date","date"],["dueTime","Due time and zone","text"],
  ["method","Submission method","select",["Email","SAM.gov","PIEE","Portal","Mail"]],["status","Status","select",STATUSES],
  ["estValue","Estimated value ($)","number"],["ourPrice","Our price ($)","number"],["contactsTxt","Government contacts","text"],["subsTxt","Subcontractors","text"],["link","Link","text"]],
 contacts:[["name","Name","text"],["title","Title","text"],["role","Role","select",["Contracting Officer","Contract Specialist","COR","Small Business Specialist","Other"]],["agency","Agency","text"],["office","Office","text"],["email","Email","text"],["phone","Phone","text"],["cadence","Touch every (days)","select",["45","30","60","90"]],["lastTouch","Last touch","date"],["nextFollow","Next follow-up","date"]],
 subs:[["company","Company","text"],["trade","Trade or NAICS","text"],["area","Service area","text"],["contact","Contact name","text"],["email","Email","text"],["phone","Phone","text"],["certs","Certifications and licenses","text"],["insurance","Insurance on file","text"],["rating","Rating","select",["Untested","Good","Great","Avoid"]],["source","Source","text"],["signedUp","Signed up","date"],["crew","Crew size","text"],["years","Years in business","text"],["sam","SAM registered","text"],["availability","Availability","text"],["pricing","Pricing","text"],["equipment","Equipment and notes","textarea"]],
 pastperf:[["contract","Contract number","text"],["agency","Agency","text"],["value","Value ($)","number"],["period","Period","text"],["scope","Scope","textarea"],["poc","Government POC","text"],["status","Status","select",["Active","Completed"]]],
 tasks:[["text","Task","text"],["due","Due","date"],["done","Done","select",["No","Yes"]]]
};
const TITLE={opportunities:d=>d.title||d.sol||"Untitled",contacts:d=>d.name||"Unnamed",subs:d=>d.company||"Unnamed",pastperf:d=>d.contract||"Untitled",tasks:d=>d.text||"Task"};

/* ---------- state ---------- */
let db=null, sample=null, userCap=null, canWrite=true;
/* records written by other tools sometimes store a list field as plain text; reshape on load so one odd record can't blank the page (Nov 20, 2026) */
const LIST_IDS=["contactIds","subIds","ppIds","matches"];
function tidy(b){if(!b||typeof b!=="object")return b;
  if(b.notes!=null&&!Array.isArray(b.notes))b={...b,notes:typeof b.notes==="string"&&b.notes.trim()?[{t:"",text:b.notes}]:[]};
  if(b.requirements!=null&&!Array.isArray(b.requirements))b={...b,requirements:typeof b.requirements==="string"&&b.requirements.trim()?[{text:b.requirements,done:false}]:[]};
  for(const f of LIST_IDS)if(b[f]!=null&&!Array.isArray(b[f]))b={...b,[f]:typeof b[f]==="string"&&b[f]?[b[f]]:[]};
  if(Array.isArray(b.notes)&&b.notes.some(n=>typeof n!=="object"||!n))b={...b,notes:b.notes.map(n=>n&&typeof n==="object"?n:{t:"",text:String(n??"")})};
  if(Array.isArray(b.requirements)&&b.requirements.some(r=>typeof r!=="object"||!r))b={...b,requirements:b.requirements.map(r=>r&&typeof r==="object"?r:{text:String(r??""),done:false})};
  return b}
const pendingDel=new Set(); /* deletes in flight: hidden from sync until the write lands */
const data={opportunities:{},contacts:{},subs:{},pastperf:{},tasks:{},feeds:{},inbox:{},portals:{}};

const QT_MAX=8, QT_AMENDED_MAX=9; /* not amended: 1 to 8 days. Amended: under 10 days, posted to the current due date */
const etDay=iso=>{if(!iso)return"";const s=String(iso);if(s.length<=10)return s.slice(0,10);const d=new Date(s);if(isNaN(d))return s.slice(0,10);try{return d.toLocaleDateString("en-CA",{timeZone:"America/New_York"})}catch(_){return s.slice(0,10)}};

/* true = amended, false = checked and not amended, null = no amendment data on the record */
function qtAmended(x){
  if(x.amended===true)return true;
  if(x.lastNotice)return etDay(x.lastNotice)!==etDay(x.posted);
  if(x.watch&&x.watch.noticesCount!=null)return Number(x.watch.noticesCount)>1;
  if(/\bamend/i.test((x.rank&&x.rank.why)||""))return true;
  if(x.amended===false)return false;
  return null}
function qtOpen(x){const u=etDay(x.due);return !!u&&u>=etDay(new Date().toISOString())}
function qtOk(x){const w=qtWin(x);if(w===null||w<1||!qtOpen(x))return false;return w<=(qtAmended(x)===true?QT_AMENDED_MAX:QT_MAX)}
function qtInbox(){return Object.entries(data.inbox).filter(([,x])=>x.state==="new"&&!blockedPlace(x.place)&&qtOk(x))}
function qtPipe(){return Object.entries(data.opportunities).map(([id,d])=>({id,...d})).filter(o=>!isPast(o)&&qtOk(o))}

let qtFilter="all", qtBusy=false, qtMsg="";
/* one Tango call: looks up the latest notice date for the federal bids in this tab and saves it on each record */
async function qtCheck(){
  if(!mcp||!db||qtBusy)return;
  const todo=Object.entries(data.inbox).filter(([id,x])=>id.startsWith("fed-")&&x.state==="new"&&qtOpen(x)&&(()=>{const w=qtWin(x);return w!==null&&w>=1&&w<=QT_AMENDED_MAX})());
  if(!todo.length){qtMsg="No federal quick-turn bids to check.";render();return}
  qtBusy=true;qtMsg="";render();
  try{
    const ps=todo.map(e=>etDay(e[1].posted)).sort(),ds=todo.map(e=>etDay(e[1].due)).sort();
    const r=await mcp.callTool("Tango","search_opportunities",{type:"opportunity",active:true,first_notice_date_after:addDays(ps[0],-1),response_deadline_after:addDays(isoDay(),-1),response_deadline_before:addDays(ds[ds.length-1],2),limit:1000,fields:"opportunity_id,first_notice_date,last_notice_date,response_deadline"},{cache:false});
    let p=r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(_){}}
    const rows=(p&&Array.isArray(p.results))?p.results:[];const by={};for(const x of rows)if(x&&x.opportunity_id)by["fed-"+x.opportunity_id]=x;
    let n=0,am=0;
    for(const [id,x] of todo){const t=by[id];if(!t||!t.last_notice_date)continue;
      const b={...x,lastNotice:t.last_notice_date,due:t.response_deadline||x.due};b.amended=etDay(b.lastNotice)!==etDay(b.posted);
      try{await db.doc("inbox/"+id).set(b);data.inbox[id]=b;n++;if(b.amended)am++}catch(_){}}
    qtMsg=rows.length?`Checked ${n} of ${todo.length} federal bids: ${am} amended, ${n-am} not amended.${n<todo.length?" The rest were not in the search result; try again later.":""}`:"The search came back empty or in a format this page could not read. Nothing was changed.";
  }catch(e){qtMsg=mcpMsg(e)}
  qtBusy=false;render();
}

async function trash(items,label){
  const saved=items.map(([c,id])=>[c,id,data[c][id]?{...data[c][id]}:null]).filter(x=>x[2]);
  if(!saved.length)return;
  for(const [c,id] of saved){delete data[c][id];pendingDel.add(c+"/"+id)}
  render();
  undoBar("✓ "+label+" deleted",async()=>{for(const [c,id,b] of saved){pendingDel.delete(c+"/"+id);const r={...b};delete r.deleted;data[c][id]=r}render();
    if(db)await Promise.all(saved.map(([c,id,b])=>{const r={...b};delete r.deleted;r.updatedAt=new Date().toISOString();return db.doc(c+"/"+id).set(r).catch(()=>{})}));toast("Restored")});
  if(!db){toast("Deleted on this device only. Open the page inside Claude so it saves.",4000);return}
  const now=new Date().toISOString();
  /* always try the write, even if the page thinks it is read only: the server decides, and a refusal is shown, never silent */
  const res=await Promise.all(saved.map(([c,id,b])=>db.doc(c+"/"+id).set({...b,deleted:true,updatedAt:now}).then(()=>null,e=>e||{message:"unknown error"})));
  const bad=res.find(Boolean);
  if(bad){for(const [c,id,b] of saved){pendingDel.delete(c+"/"+id);data[c][id]=b}const u=$("#undo");if(u)u.remove();render();
    const ro=bad.code==="invalid_argument"||bad.code==="permission_denied"||/permission|read.?only|not allowed|forbidden/i.test(bad.message||"");
    $("#sync").textContent="Delete failed";
    toast(ro?"Delete blocked: this page is read only for you. Ask the owner for edit access.":"Delete did not save ("+(bad.message||bad.code||"unknown error")+"). Try again.",6000);return}
  for(const [c,id] of saved)pendingDel.delete(c+"/"+id);
  if(canWrite===false){canWrite=true;$("#sync").textContent="Synced"}
}

async function toRows(payload,kind){

async function runFeed(fid,f,since){
  const out=[];
  if(f.source==="federal"){
    const args={type:"opportunity",active:true,response_deadline_after:today(),first_notice_date_after:since,limit:50,
      fields:"opportunity_id,title,solicitation_number,naics_code,set_aside,response_deadline,first_notice_date,last_notice_date,office(*),place_of_performance,primary_contact,meta,sam_url"};
    if(f.naics&&f.naics.length)args.naics_codes=f.naics; if(f.keyword)args.keyword=f.keyword; if(f.noticeTypes)args.notice_type=f.noticeTypes; if(f.place)args.place_of_performance=f.place;
    const r=await mcp.callTool("Tango","search_opportunities",args,{cache:false});
    for(const x of await toRows(r.payload,"fed")){
      if(!x||!x.opportunity_id)continue; if(x.set_aside&&RESTRICTED.test(x.set_aside))continue;
      const o=x.office||{},pl=x.place_of_performance||{},pc=x.primary_contact||{},nt=(x.meta&&x.meta.notice_type)||{};
      if(blockedPlace(pl.state))continue;
      out.push(["fed-"+x.opportunity_id,{src:"Federal",level:"federal",feed:f.name,title:x.title||"",sol:x.solicitation_number||"",naics:x.naics_code||"",setAside:x.set_aside||"Unrestricted or not stated",
        due:x.response_deadline||"",posted:x.first_notice_date||"",lastNotice:x.last_notice_date||"",agency:o.agency_name||o.department_name||"",office:o.office_name||"",place:[pl.city,pl.state].filter(Boolean).join(", "),
        noticeType:TOAPP[nt.code]||nt.type||"",contact:pc.full_name?{name:pc.full_name,email:pc.email||"",phone:pc.phone||""}:null,link:x.sam_url||""}]);
    }
  }else{
    const lvl=feedLevel(f);
    const jurs=(f.jurisdictions&&f.jurisdictions.length)?f.jurisdictions:(lvl==="local"?["local","education","unknown"]:["state"]);
    const kws=(f.keywords&&f.keywords.length)?f.keywords:[""];
    for(const jur of jurs)for(const kw of kws){
      const args={type:"sled_opportunity",limit:100,first_seen_after:since,response_deadline_after:today(),jurisdiction:jur}; if(kw)args.keyword=kw; if(f.states)args.state=f.states;
      const r=await mcp.callTool("Tango","search_opportunities",args,{cache:false});
      for(const x of await toRows(r.payload,"sled")){
        if(!x||!x.opportunity_id)continue; if(blockedPlace(x.state))continue;
        const j=x.jurisdiction||jur;
        const level=j==="state"?"state":j==="unknown"?(LOCALRX.test(x.agency||"")?"local":"state"):"local";
        out.push(["sled-"+x.opportunity_id,{src:level==="local"?"Local":"State",level,jur:j,feed:f.name,title:x.title||"",sol:x.solicitation_number||"",naics:"",setAside:j+(x.solicitation_type?" · "+x.solicitation_type.toUpperCase():""),
          due:x.response_deadline||"",posted:x.posted_date||"",agency:x.agency||"",office:"",place:x.state||"",noticeType:"State or local",contact:null,link:x.source_url||""}]);
      }
    }
  }
  return out;
}
async function pullAll(manual,only){
  if(!mcp){feedErr="Pulls need this page opened inside Claude with the Tango connector.";render();return}
  pulling=only||"all";feedErr="";render();
  const by={...(feedMeta.lastRunBy||{})};
  const sinceFor=l=>{const lr=by[l]||feedMeta.lastRun;return lr?new Date(new Date(lr).getTime()-864e5).toISOString().slice(0,10):new Date(Date.now()-14*864e5).toISOString().slice(0,10)};
  const sols=new Set(Object.values(data.opportunities).map(o=>(o.sol||"").toUpperCase()).filter(Boolean));
  let added=0,errs=[];const ran=new Set();
  for(const [fid,f] of Object.entries(data.feeds)){ if(f.on===false)continue; const l=feedLevel(f); if(only&&l!==only)continue;
    try{const rows=await runFeed(fid,f,sinceFor(l)); ran.add(l);
      for(const [id,b] of rows){ if(data.inbox[id])continue; if(b.sol&&sols.has(b.sol.toUpperCase()))continue;
        await db.doc("inbox/"+id).set({...b,state:"new",found:new Date().toISOString()}); data.inbox[id]={...b,state:"new"}; added++; }
    }catch(e){errs.push(f.name+": "+mcpMsg(e)); if(e&&["server_not_connected","needs_reauth","not_granted","blocked_by_policy"].includes(e.code))break;}
  }
  const cutoff=Date.now()-3*864e5;
  for(const [id,x] of Object.entries(data.inbox)){ const d=x.due?new Date(x.due).getTime():Infinity; if((x.state!=="new"&&x.found&&new Date(x.found).getTime()<Date.now()-21*864e5)||d<cutoff){try{await db.doc("inbox/"+id).delete()}catch(_){}} }
  if(ran.size&&(!errs.length||added)){const now=new Date().toISOString();for(const l of ran)by[l]=now;const meta={...feedMeta,lastRunBy:by,lastAdded:added};if(!only)meta.lastRun=now;try{await db.doc("settings/feeds").set(meta)}catch(_){}}
  pulling=false; feedErr=errs.join(" "); if(manual)toast(added?added+" new":"Nothing new since last pull"); render();
}

function portalList(){const m={};for(const p of PORTALS_BASE)m[p.id]={...p};for(const [id,d] of Object.entries(data.portals||{}))m[id]={...(m[id]||{}),...d,id};return Object.values(m).filter(p=>!p.hidden&&p.name)}
const portalDue=p=>{const n=daysSince(p.lastChecked);return n===null||n>7};
function portalsBlock(k){
  const all=portalList().filter(p=>p.level===k); if(!all.length&&k!=="local"&&k!=="state")return"";
  const f=portalSt[k]; const rank={aggregator:0,state:0,school:1,city:2,county:3,other:4};
  const list=all.filter(p=>f==="all"||(f==="due"?portalDue(p):p.st===f)).sort((a,b)=>(rank[a.kind]??5)-(rank[b.kind]??5)||(a.st<b.st?-1:a.st>b.st?1:0)||a.name.localeCompare(b.name));
  const nDue=all.filter(portalDue).length;
  const chip=(v,l)=>`<button class="chip ${f===v?"on":""}" onclick="portalSt['${k}']='${v}';render()">${esc(l)}</button>`;
  const rows=list.map(p=>{const n=daysSince(p.lastChecked);const d=portalDue(p);
    return`<div class="prow"><div><div class="ttl">${esc(p.name)}</div><div class="meta">${esc([p.st==="IL"?"Illinois":"Montana",PKIND[p.kind]||"",p.note].filter(Boolean).join(" · "))}</div><span class="rel ${d?"due":"warm"}">${p.lastChecked?(n===0?"Checked today":"Checked "+n+"d ago"):"Not checked yet"}</span></div>
    <div class="pa">${/^https?:\/\//i.test(p.url||"")?`<a class="btn ghost sm nbtn" href="${esc(p.url)}" target="_blank" rel="noopener">Open ↗</a>`:`<button class="btn line sm nbtn" onclick="portalForm('${p.id}')">Add link</button>`}<button class="btn sm nbtn" onclick="portalChecked('${p.id}')">Checked</button><button class="btn line sm nbtn" onclick="portalForm('${p.id}')">Edit</button></div></div>`}).join("");
  return`<details class="portals" ${portalOpen[k]?"open":""} ontoggle="portalOpen['${k}']=this.open"><summary>${k==="local"?"City, county and school":"State"} bid portals · ${all.length}<span class="sub">${nDue} need a check this week</span></summary>
  <div class="chips">${chip("all","All")}${chip("IL","Illinois")}${chip("MT","Montana")}${chip("due","Needs a check "+nDue)}</div>
  ${rows||'<div class="empty">No portals in this filter.</div>'}
  <div class="row" style="margin:10px 0"><button class="btn line sm" onclick="portalForm(null,'${k}')">Add portal</button></div></details>`;
}
async function portalChecked(id){const prev=data.portals[id]||{};if(await save("portals",id,{...prev,lastChecked:isoDay()}))toast("Marked checked");render()}
function portalForm(id,lvl){
  const p=id?portalList().find(x=>x.id===id)||{}:{level:lvl||"local",st:"IL",kind:"city"};
  const s=$("#sheet");s.dataset.coll="";s.dataset.id="";s.dataset.mode="edit";
  const opt=(name,cur,pairs)=>`<select class="t" name="${name}">${pairs.map(([v,l])=>`<option value="${v}" ${cur===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  s.innerHTML=`<div class="bar"><button class="back" onclick="closeSheet()">Cancel</button><div class="row">${id?`<button class="btn danger sm" onclick="portalHide('${id}')">Remove</button>`:""}<button class="btn sm" onclick="portalSave('${id||""}')">Save</button></div></div>

  <label class="f">Link<input class="t" name="url" inputmode="url" placeholder="https://" value="${esc(p.url||"")}"></label>
  <label class="f">Level${opt("level",p.level,[["local","Local: cities, counties, schools"],["state","State agencies and universities"]])}</label>
  <label class="f">State${opt("st",p.st,[["IL","Illinois"],["MT","Montana"]])}</label>
  <label class="f">Type${opt("kind",p.kind,Object.entries(PKIND))}</label>
  <label class="f">Note<input class="t" name="note" value="${esc(p.note||"")}"></label></form>`;
  s.classList.add("open");s.scrollTop=0}
async function portalSave(id){const fd=new FormData($("#pf"));const g=k=>(fd.get(k)||"").toString().trim();
  if(!g("name")){toast("Add a name");return}
  const pid=id||("p-"+uid());const prev=data.portals[pid]||{};
  if(await save("portals",pid,{...prev,name:g("name"),url:g("url"),level:g("level"),st:g("st"),kind:g("kind"),note:g("note"),hidden:false})){toast("Portal saved");closeSheet()}}
async function portalHide(id){if(!await ask("Remove this portal from the list?",{ok:"Remove"}))return;const prev=data.portals[id]||{};await save("portals",id,{...prev,hidden:true});closeSheet()}
function renderFeed(){
  const all=Object.entries(data.inbox).filter(([,x])=>x.state==="new"&&!blockedPlace(x.place));
  const shown=all.filter(([,x])=>!tradeOnly||TRADE.test(x.title||""));

  const lastBy=feedMeta.lastRunBy||{};
  const fmt=t=>t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"never";
  const sorter=(a,b)=>((b[1].rank?.score??-1)-(a[1].rank?.score??-1))||((a[1].due||"9")<(b[1].due||"9")?-1:1);
  const mo=new Date().getMonth();
  const short=t=>{if(!t)return"never";const d=new Date(t);return isoDay(d)===isoDay()?d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):d.toLocaleDateString([],{month:"short",day:"numeric"})};
  const pick=LEVELS.map(([k,l])=>{const n=shown.filter(e=>lv(e)===k).length;const sz=SEASON.find(z=>z.lv.toLowerCase()===k);const md=sz?sz.md[mo]:"";const on=feedLevelFilter===k;
    return`<button class="lvlcard ${on?"on":""}" aria-pressed="${on}" onclick="feedLevelFilter=feedLevelFilter==='${k}'?'all':'${k}';render()"><span class="lv">${esc(l)}</span><span class="md">${n} new</span><span class="sb">${pulling===k||pulling==="all"?"Pulling...":"Pulled "+esc(short(lastBy[k]||feedMeta.lastRun))}</span></button>`}).join("");
  const chips=`<button class="chip ${feedLevelFilter==="all"?"on":""}" onclick="feedLevelFilter='all';render()">All ${shown.length}</button><button class="chip ${tradeOnly?"on":""}" onclick="tradeOnly=!tradeOnly;render()">KCAPEX trades only</button>`;
  const sec=([k,l,desc])=>{ if(feedLevelFilter!=="all"&&feedLevelFilter!==k)return"";
    const items=shown.filter(e=>lv(e)===k).sort(sorter);
    const feeds=Object.entries(data.feeds).filter(([,f])=>feedLevel(f)===k);
    const busy=pulling===k||pulling==="all";
    return`<h2>${esc(l)} <span class="sub">${items.length} new</span></h2><p class="sub" style="margin-bottom:6px">${esc(desc)} · Last pull ${esc(fmt(lastBy[k]||feedMeta.lastRun))}</p>
    <div class="row"><button class="btn sm" ${pulling||!mcp?"disabled":""} onclick="pullAll(true,'${k}')">${busy?"Pulling...":"Pull "+esc(l)}</button><button class="btn line sm" onclick="feedForm(null,'${k}')">Add ${esc(l.toLowerCase())} search</button></div>
    ${k==="local"?localNote():""}${k!=="federal"?portalsBlock(k):""}
    <div style="margin-top:10px">${items.length?items.map(([id,x])=>inboxCard(id,x)).join(""):`<div class="empty">Nothing new for ${esc(l.toLowerCase())}${tradeOnly?" in KCAPEX trades":""}.</div>`}</div>
    ${feeds.length?`<p class="sub" style="margin:10px 0 4px">Saved ${esc(l.toLowerCase())} searches</p>${feeds.map(([fid,f])=>feedRow(fid,f)).join("")}`:""}`};
  return`<h1>New opportunities</h1><p class="sub">Pulled once a day when you open the app. Tap Local, State or Federal to see just that pull. State and local cover state agencies, cities, counties and schools in Illinois and Montana.</p>
  <div class="row"><button class="btn sm" ${pulling||!mcp?"disabled":""} onclick="pullAll(true)">${pulling==="all"?"Pulling...":"Pull all"}</button>${sample&&all.length?`<button class="btn ghost sm" onclick="rankIn()">Rank with Claude</button>`:""}</div>
  ${!mcp?'<div class="notice">New opportunities are pulled by the Claude version of your Pipeline, which uses the Tango connector. This phone app shows what was copied over and cannot run pulls itself.</div>':""}
  ${feedErr?`<div class="notice">${esc(feedErr)}</div>`:""}
  <div class="lvlpick">${pick}</div><div class="chips">${chips}</div>${LEVELS.map(sec).join("")}`}
function feedForm(fid,lvl){
  const f=fid?data.feeds[fid]:{source:lvl==="federal"?"federal":"state",level:lvl||"federal",on:true,naics:[],keywords:[],states:lvl&&lvl!=="federal"?"IL|MT":""};
  const L=feedLevel(f);
  const s=$("#sheet");s.dataset.coll="";s.dataset.id="";s.dataset.mode="edit";
  s.innerHTML=`<div class="bar"><button class="back" onclick="closeSheet()">Cancel</button><div class="row">${fid?`<button class="btn danger sm" onclick="delFeed('${fid}')">Delete</button>`:""}<button class="btn sm" onclick="saveFeed('${fid||""}')">Save</button></div></div>
  <h1>${fid?"Edit":"New"} saved search</h1><form id="ff" onsubmit="return false">
  <label class="f">Name<input class="t" name="name" value="${esc(f.name||"")}"></label>
  <label class="f">Level<select class="t" name="level"><option value="local" ${L==="local"?"selected":""}>Local: cities, counties, schools</option><option value="state" ${L==="state"?"selected":""}>State agencies</option><option value="federal" ${L==="federal"?"selected":""}>Federal, SAM.gov</option></select></label>
  <label class="f">NAICS codes, federal only, comma separated<input class="t" name="naics" value="${esc((f.naics||[]).join(", "))}"></label>
  <label class="f">Notice types, federal only<select class="t" name="noticeTypes"><option value="" ${!f.noticeTypes?"selected":""}>All</option><option value="o|k" ${f.noticeTypes==="o|k"?"selected":""}>Solicitations only</option><option value="r" ${f.noticeTypes==="r"?"selected":""}>Sources sought only</option><option value="r|p" ${f.noticeTypes==="r|p"?"selected":""}>Sources sought and presolicitations</option></select></label>
  <label class="f">Place of performance, federal only, 2-letter state<input class="t" name="place" value="${esc(f.place||"")}"></label>
  <label class="f">Keyword, federal only, optional<input class="t" name="keyword" value="${esc(f.keyword||"")}"></label>
  <label class="f">States, state and local only, like IL|MT<input class="t" name="states" value="${esc(f.states||"")}"></label>
  <label class="f">Keywords, state and local only, optional. Leave blank to pull everything posted<input class="t" name="keywords" value="${esc((f.keywords||[]).join(", "))}"></label>
  <label class="f">On<select class="t" name="on"><option value="yes" ${f.on!==false?"selected":""}>Yes</option><option value="no" ${f.on===false?"selected":""}>Paused</option></select></label></form>`;
  s.classList.add("open");s.scrollTop=0}
async function saveFeed(fid){const fd=new FormData($("#ff"));const g=k=>(fd.get(k)||"").toString().trim();const level=g("level")||"federal";
  const prev=fid?data.feeds[fid]||{}:{};
  const body={...prev,name:g("name")||"Saved search",level,source:level==="federal"?"federal":"state",naics:g("naics").split(/[,\s]+/).filter(Boolean),noticeTypes:g("noticeTypes"),place:g("place").toUpperCase(),keyword:g("keyword"),states:g("states").toUpperCase().replace(/\s/g,""),keywords:g("keywords").split(",").map(x=>x.trim()).filter(Boolean),on:g("on")!=="no"};
  if(prev.level!==level)delete body.jurisdictions;
  const id=fid||uid(); if(await save("feeds",id,body)){toast("Saved search saved");closeSheet()}}
async function delFeed(fid){if(!await ask("Delete this saved search?"))return;if(db){try{await db.doc("feeds/"+fid).delete()}catch(e){toast("Delete failed")}}else{delete data.feeds[fid]}closeSheet()}
async function dismissIn(id){const x={...data.inbox[id],state:"dismissed"};if(db){try{await db.doc("inbox/"+id).set(x)}catch(e){toast("Could not update")}}else{data.inbox[id]=x;render()}}
async function takeIn(id){
  const x=data.inbox[id]; if(!x)return;
  let contactIds=[];
  if(x.contact&&x.contact.email){const hitc=Object.entries(data.contacts).find(([,c])=>(c.email||"").toLowerCase()===x.contact.email.toLowerCase());
    if(hitc)contactIds=[hitc[0]];else{const cid=uid();await save("contacts",cid,{name:x.contact.name,email:x.contact.email,phone:x.contact.phone,agency:x.agency,office:x.office,role:"Contracting Officer",title:""});contactIds=[cid]}}
  const oid=id; const body={title:x.title,sol:x.sol,agency:x.agency,office:x.office,noticeType:x.noticeType||"Other",setAside:x.setAside,naics:x.naics,place:x.place,posted:dayOnly(x.posted),due:dayOnly(x.due),dueTime:x.due?timeOnly(x.due):"",
    method:"Email",status:"found",link:x.link,contactIds,...(x.lastNotice?{lastNotice:x.lastNotice}:{}),...(typeof x.amended==="boolean"?{amended:x.amended}:{}),notes:[{t:new Date().toLocaleString(),text:`Added from saved search "${x.feed}" (${x.src}).${x.rank?" Claude rank "+x.rank.score+": "+x.rank.why:""}`}]};
  if(await save("opportunities",oid,body)){autoTasks(oid,body);if(db){try{await db.doc("inbox/"+id).set({...x,state:"added"})}catch(_){}}toast("Added to pipeline");openDetail("opportunities",oid)}}
async function rankIn(){
  const items=Object.entries(data.inbox).filter(([,x])=>x.state==="new").slice(0,40).map(([id,x])=>({id,level:levelOf(x),title:x.title,type:x.noticeType,setAside:x.setAside,naics:x.naics,agency:x.agency,place:x.place,due:x.due}));
  toast("Ranking...");
  try{const r=await sample.json(`${KCAPEX}\nToday is ${new Date().toDateString()}. For 6-7 months KCAPEX is bidding only 1-2 RFQs a month and prioritizing sources sought responses to shape future set-asides.\n\nScore each opportunity 0-100 for KCAPEX to pursue now and give a one-sentence reason. Consider eligibility (no socioeconomic certifications), fit to trades it can subcontract, deadline feasibility, and strategic value of sources sought. Return ONLY a JSON array of {"id":string,"score":number,"why":string} for every item.\n\n${JSON.stringify(items)}`,{modelTier:"default",cache:false});
    for(const it of (Array.isArray(r)?r:[])){const x=data.inbox[it.id];if(!x)continue;const b={...x,rank:{score:Math.round(it.score),why:String(it.why||"")}};if(db){try{await db.doc("inbox/"+it.id).set(b)}catch(_){}}else data.inbox[it.id]=b}
    render();toast("Ranked")}catch(e){toast(e&&e.code==="not_granted"?"Claude features are off":"Ranking failed")}}
boot();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
